<aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 h-full border-r border-slate-800 select-none">
  <div class="px-4 py-5 flex-1 overflow-y-auto space-y-6">
    <div>
      <p class="px-3 text-[11px] font-semibold text-slate-400 tracking-wider uppercase mb-2">Main Navigation</p>
      <nav class="space-y-1">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-blue-600 text-white font-medium"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          Dashboard
        </a>

        <ng-container *ngIf="currentUser$ | async as user">
          <!-- Employees Directory (Admin, HR, Manager) -->
          <a
            *ngIf="user.role === 'ADMIN' || user.role === 'HR' || user.role === 'MANAGER'"
            routerLink="/employees"
            routerLinkActive="bg-blue-600 text-white font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            Employees
          </a>

          <!-- Attendance Module -->
          <a
            routerLink="/attendance"
            routerLinkActive="bg-blue-600 text-white font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Attendance
          </a>

          <!-- Leave Management Portal -->
          <a
            routerLink="/leaves"
            routerLinkActive="bg-blue-600 text-white font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            Leave Portal
          </a>

          <!-- Approvals Queue (Manager, HR, Admin) -->
          <a
            *ngIf="user.role === 'ADMIN' || user.role === 'HR' || user.role === 'MANAGER'"
            routerLink="/leaves/approvals"
            routerLinkActive="bg-blue-600 text-white font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Approvals Queue
          </a>

          <!-- Reports & Analytics (Admin, HR, Manager) -->
          <a
            *ngIf="user.role === 'ADMIN' || user.role === 'HR' || user.role === 'MANAGER'"
            routerLink="/reports"
            routerLinkActive="bg-blue-600 text-white font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            Reports & Analytics
          </a>
        </ng-container>
      </nav>
    </div>

    <!-- Administrative Governance Links (Admin & HR only) -->
    <ng-container *ngIf="currentUser$ | async as user">
      <div *ngIf="user.role === 'ADMIN' || user.role === 'HR'">
        <p class="px-3 text-[11px] font-semibold text-slate-400 tracking-wider uppercase mb-2">Administration</p>
        <nav class="space-y-1">
          <a
            routerLink="/departments"
            routerLinkActive="bg-blue-600 text-white font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
            Departments
          </a>

          <a
            routerLink="/leave-configuration"
            routerLinkActive="bg-blue-600 text-white font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Leave Configuration
          </a>
        </nav>
      </div>
    </ng-container>

    <div>
      <p class="px-3 text-[11px] font-semibold text-slate-400 tracking-wider uppercase mb-2">Account</p>
      <nav class="space-y-1">
        <a
          routerLink="/profile"
          routerLinkActive="bg-blue-600 text-white font-medium"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs hover:bg-slate-800 hover:text-white transition-colors"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          My Profile & Settings
        </a>
      </nav>
    </div>
  </div>

  <div class="p-4 border-t border-slate-800 text-[11px] text-slate-400 shrink-0">
    <div class="flex items-center justify-between">
      <span>Enterprise Portal</span>
      <span class="px-1.5 py-0.5 rounded bg-slate-800 text-blue-400 font-mono text-[10px]">v1.0</span>
    </div>
  </div>
</aside>
