<div
  *ngIf="shouldShow && errorMessage"
  class="text-[11px] text-rose-600 font-medium mt-1 flex items-center gap-1 transition-opacity duration-150"
  role="alert"
  aria-live="polite"
>
  <svg class="w-3.5 h-3.5 shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
  </svg>
  <span>{{ errorMessage }}</span>
</div>
