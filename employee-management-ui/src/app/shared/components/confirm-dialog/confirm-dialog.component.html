<div *ngIf="dialog$ | async as dialog" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs" (click)="onCancel()"></div>
  <div class="relative bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl z-10 space-y-4 border border-slate-200">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
        [ngClass]="dialog.data.isDestructive ? 'bg-rose-100 text-rose-600' : 'bg-blue-100 text-blue-600'"
      >
        <svg *ngIf="dialog.data.isDestructive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <svg *ngIf="!dialog.data.isDestructive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-900 leading-tight">{{ dialog.data.title }}</h3>
        <p class="text-xs text-slate-500 mt-1 leading-relaxed">{{ dialog.data.message }}</p>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors"
      >
        {{ dialog.data.cancelText || 'Cancel' }}
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        class="px-4 py-2 rounded-xl text-xs font-bold text-white shadow-xs transition-colors"
        [ngClass]="dialog.data.isDestructive ? 'bg-rose-600 hover:bg-rose-700' : 'bg-blue-600 hover:bg-blue-700'"
      >
        {{ dialog.data.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
