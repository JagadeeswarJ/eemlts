<div *ngIf="dialog$ | async as dialog" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-[#3E3530]/50 backdrop-blur-xs" (click)="onCancel()"></div>
  <div class="relative bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl z-10 space-y-4 border border-[#CCB499]/40">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
        [ngClass]="dialog.data.isDestructive ? 'bg-[#A84A3B]/15 text-[#A84A3B]' : 'bg-[#CCB499]/30 text-[#BB6C43]'"
      >
        <svg *ngIf="dialog.data.isDestructive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <svg *ngIf="!dialog.data.isDestructive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-[#4A413C] leading-tight">{{ dialog.data.title }}</h3>
        <p class="text-xs text-[#7D7067] mt-1 leading-relaxed">{{ dialog.data.message }}</p>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-3 border-t border-[#CCB499]/20">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 rounded-xl border border-[#CCB499]/60 text-xs font-semibold text-[#4A413C] hover:bg-[#CCB499]/20 transition-colors"
      >
        {{ dialog.data.cancelText || 'Cancel' }}
      </button>
      <button
        type="button"
        (click)="onConfirm()"
        class="px-4 py-2 rounded-xl text-xs font-bold text-white shadow-xs transition-colors"
        [ngClass]="dialog.data.isDestructive ? 'bg-[#A84A3B] hover:bg-[#8F3F32]' : 'bg-[#BB6C43] hover:bg-[#A35933]'"
      >
        {{ dialog.data.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
