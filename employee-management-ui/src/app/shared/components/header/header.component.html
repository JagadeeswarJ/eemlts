<header class="h-16 bg-[#FFFFFF] border-b border-[#E4DDD6] shrink-0 z-30 px-4 sm:px-6 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      aria-label="Toggle navigation drawer"
      class="lg:hidden p-2 rounded-xl text-[#7A6F68] hover:text-[#4A413C] hover:bg-[#F4EFEA] transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-[#BB6C43] flex items-center justify-center text-white font-extrabold text-xs shadow-sm tracking-wider">
        EMS
      </div>
      <div>
        <h1 class="text-base font-bold text-[#4A413C] tracking-tight leading-none">EMS</h1>
        <span class="text-[10px] text-[#8D8078] font-medium tracking-wide">Workforce Platform</span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <ng-container *ngIf="currentUser$ | async as user">
      <div class="flex items-center gap-3 text-right">
        <div>
          <p class="text-xs sm:text-sm font-semibold text-[#4A413C] leading-tight">{{ user.fullName || user.email }}</p>
          <div class="flex items-center justify-end gap-1.5 mt-0.5">
            <span class="text-[11px] text-[#7A6F68] hidden sm:inline">{{ user.designation }}</span>
            <span class="hidden sm:inline-block w-1 h-1 rounded-full bg-[#CCB499]"></span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase bg-[#FBEFE9] text-[#BB6C43] border border-[#F0D4C5]">
              {{ user.role }}
            </span>
          </div>
        </div>
        <div class="w-9 h-9 rounded-full bg-[#FAF7F4] border border-[#CCB499] flex items-center justify-center font-bold text-[#4A413C] text-xs sm:text-sm shadow-xs">
          {{ getInitials(user.fullName || user.email) }}
        </div>
      </div>
    </ng-container>

    <button
      type="button"
      (click)="onLogout()"
      title="Sign Out"
      aria-label="Sign out of system"
      class="p-2 rounded-xl text-[#7A6F68] hover:text-[#BB6C43] hover:bg-[#FBEFE9] transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
    </button>
  </div>
</header>
