<div class="space-y-6">
  <!-- Top Navigation & Header -->
  <div class="flex items-center justify-between pb-4 border-b border-[#E4DDD6]">
    <div class="flex items-center gap-3">
      <a
        routerLink="/leaves"
        class="p-2 rounded-xl text-[#7A6F68] hover:text-[#4A413C] hover:bg-[#FAF7F4] transition-colors"
        title="Back to Leaves"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
      </a>
      <div>
        <h2 class="text-xl sm:text-2xl font-bold text-[#4A413C] tracking-tight font-display">Team Leave Calendar</h2>
        <p class="text-xs text-[#7A6F68] mt-0.5">Visualize approved time-off schedules across colleagues and departments.</p>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-[#E4DDD6] shadow-xs p-6 space-y-4">
    <app-loading-spinner
      *ngIf="loading$ | async"
      [loading]="true"
      text="Loading schedule calendar..."
    ></app-loading-spinner>

    <div *ngIf="!(loading$ | async)">
      <div *ngIf="((calendarItems$ | async)?.length || 0) === 0" class="p-12 text-center text-[#7A6F68] text-xs">
        No approved team leaves scheduled for this upcoming period.
      </div>

      <div *ngIf="((calendarItems$ | async)?.length || 0) > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let item of calendarItems$ | async" class="p-4 rounded-xl border border-[#E4DDD6] bg-[#FAF7F4] space-y-2">
          <div class="flex items-start justify-between">
            <div>
              <h4 class="text-sm font-bold text-[#4A413C]">{{ item.employeeName }}</h4>
              <span class="text-[11px] font-mono text-[#7A6F68]">{{ item.employeeCode }}</span>
            </div>
            <app-status-badge [status]="item.status"></app-status-badge>
          </div>

          <div class="pt-2 border-t border-[#E4DDD6] flex items-center justify-between text-xs">
            <span class="font-semibold text-[#4A413C]">{{ item.leaveTypeName }}</span>
            <span class="font-bold text-[#BB6C43]">{{ item.totalDays }} Days</span>
          </div>

          <div class="p-2 bg-white rounded-lg border border-[#E4DDD6] text-[11px] text-[#5F554F] font-mono flex items-center justify-center">
            {{ item.startDate }} &rarr; {{ item.endDate }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
