<div class="min-h-screen bg-slate-100 flex flex-col justify-center p-4 sm:p-6 lg:p-8">
  <div class="max-w-md w-full mx-auto bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-200 p-8 sm:p-10 space-y-6">
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-black text-lg mx-auto shadow-md">
        WP
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Reset Password</h1>
      <p class="text-xs text-slate-500">
        Enter your registered corporate email to receive recovery instructions.
      </p>
    </div>

    <app-alert
      *ngIf="alertMessage()"
      [message]="alertMessage()"
      [type]="alertType()"
      (dismiss)="alertMessage.set(null)"
    ></app-alert>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
      <div>
        <label for="reset-email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          Work Email Address <span class="text-rose-500">*</span>
        </label>
        <input
          id="reset-email"
          type="email"
          formControlName="email"
          placeholder="alex.jones@company.com"
          [attr.aria-invalid]="form.get('email')?.invalid && (form.get('email')?.touched || submitted())"
          aria-describedby="reset-email-error"
          class="w-full px-3.5 py-2.5 rounded-xl border text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          [ngClass]="form.get('email')?.invalid && (form.get('email')?.touched || submitted()) ? 'border-rose-400 bg-rose-50/20' : 'border-slate-300'"
        />
        <app-validation-message
          id="reset-email-error"
          [control]="form.get('email')"
          fieldName="Work email"
          [submitted]="submitted()"
        ></app-validation-message>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || loading()"
        [attr.aria-busy]="loading() ? 'true' : 'false'"
        class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md shadow-blue-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
      >
        <span *ngIf="loading()" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" aria-hidden="true"></span>
        <span>{{ loading() ? 'Submitting...' : 'Send Reset Instructions' }}</span>
      </button>
    </form>

    <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
      <a routerLink="/" class="text-slate-500 hover:text-slate-800 font-medium">
        &larr; Back to Home
      </a>
      <a routerLink="/sign-in" class="font-bold text-blue-600 hover:text-blue-800">
        Remember Password? Sign In
      </a>
    </div>
  </div>
</div>
