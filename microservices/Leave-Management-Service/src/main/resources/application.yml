server:
  port: 8083

spring:
  application:
    name: leave-management-service

  config:
    import:
      - "optional:file:../database.yml"
      - "optional:file:./microservices/database.yml"
      - "optional:file:./database.yml"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: employeeManagementSystemSecretKey2026SecureEnterpriseKeyMustBeAtLeast256BitsLong!
  expiration: 7200000

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.employee: DEBUG
