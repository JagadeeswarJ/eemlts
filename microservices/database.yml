# ==============================================================================
# Single Source Database Configuration for EMS Microservices
# ==============================================================================
# All microservices (Employee, Attendance, Leave, Reporting) import their
# database credentials and R2DBC connection parameters from this file.
# ==============================================================================

spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/employee_management_db
    username: root
    password: ${DB_PASSWORD:root}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
