server:
  port: 8084

spring:
  application:
    name: reporting-dashboard-service

  r2dbc:
    url: r2dbc:mysql://localhost:3306/employee_management_db
    username: root
    password: ${DB_PASSWORD:root}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: employeeManagementSystemSecretKey2026SecureEnterpriseKeyMustBeAtLeast256BitsLong!
  expiration: 7200000

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.employee: DEBUG
